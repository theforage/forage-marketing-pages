<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="description" content="Forage Marketing Pages — static marketing page prototypes built with Gembox, the Forage Design System." />
<title>Forage Marketing Pages</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="config/gembox-tokens.css" />
<link rel="stylesheet" href="landing.css" />
<script src="shared/prototype-toolbar.js"></script>
</head>
<body>
<main class="landing">
  <header class="landing-hero">
    <img class="landing-hero__logo" src="assets/landing/forage-gembox-logo.svg" width="309" height="113" alt="Forage Gembox" decoding="async" />
    <p class="landing-hero__tagline">Marketing page prototypes using Gembox, the Forage Design System</p>
  </header>

  <table class="table-enterprise prototypes-table" aria-label="Forage marketing pages">
    <thead class="sr-only">
      <tr>
        <th scope="col">Audience</th>
        <th scope="col">Page</th>
        <th scope="col">Description</th>
        <th scope="col">Open</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td class="col-product">Sample</td>
        <td class="col-prototype">Starter page</td>
        <td class="col-description">Starter marketing page wired to the shared toolbar and Gembox tokens. Duplicate this folder to begin a new page.</td>
        <td class="col-action">
          <a class="prototype-action-link" href="starter-page/index.html">
            <span>Open</span>
            <img src="assets/landing/icon-chevron-right.svg" width="12" height="12" alt="" decoding="async" />
          </a>
        </td>
      </tr>
    </tbody>
  </table>

  <footer class="landing-footer">Forage &copy;2026</footer>
</main>
</body>
</html>
